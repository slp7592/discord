<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notre Discord privé</title>
<style>
:root{--emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;--bg:#f4f5f7;--side:#e3e5ea;--card:#fff;--txt:#1f2430;--mut:#6b7280;--acc:#5865f2;--bd:#d6d9e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2d31;--side:#1e1f22;--card:#383a40;--txt:#eceef2;--mut:#9aa0ab;--bd:#444750}}
:root[data-theme="dark"]{--bg:#2b2d31;--side:#1e1f22;--card:#383a40;--txt:#eceef2;--mut:#9aa0ab;--bd:#444750}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
#gate{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;max-width:340px;width:100%;text-align:center}
.box h1{font-size:20px;margin:0 0 6px}.box p{color:var(--mut);margin:0 0 14px;font-size:14px}
input,button{font:inherit}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt);margin-bottom:10px}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;width:100%}
#err,#aerr{color:#e5484d;font-size:13px;min-height:18px;margin-top:8px}
#app{display:none;height:100%;flex-direction:column}
#tabs{display:flex;gap:6px;padding:10px;background:var(--side);overflow-x:auto;flex-shrink:0}
.tab{width:auto;white-space:nowrap;background:transparent;color:var(--txt);border:1px solid var(--bd);padding:8px 14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;max-width:640px;word-wrap:break-word;overflow-wrap:anywhere}
.m b{color:var(--acc)}.m small{color:var(--mut);margin-left:6px;font-size:12px}
.m div{white-space:pre-wrap}
#note{color:var(--mut);text-align:center;font-size:14px;padding:30px 10px}
#adm{width:auto;margin-left:auto;white-space:nowrap;background:transparent;color:var(--txt);border:1px solid var(--bd);padding:8px 14px}
#adm.on{background:#e5484d;border-color:#e5484d;color:#fff}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}
.del{width:auto;padding:2px 8px;background:transparent;color:#e5484d;border:1px solid #e5484d;font-size:12px;margin-left:8px;border-radius:8px}
.ghost{background:transparent;color:var(--mut);margin-top:6px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ip{color:var(--mut);font-size:11px;opacity:.75;white-space:nowrap;display:none}
body.isadm .ip{display:inline}
.del{display:none}
body.isadm .del{display:inline-block}
.m.hid{background:rgba(245,158,11,.22);border-color:#f59e0b}
.del.rst{color:#2e9e5b;border-color:#2e9e5b}
.m audio{display:block;width:100%;max-width:300px;height:38px;margin-top:6px}
.m .bad{color:var(--mut);font-style:italic;margin-top:4px}
#mic{background:transparent;color:var(--txt);border:1px solid var(--bd);padding:11px 12px;white-space:nowrap}
#mic.rec{background:#e5484d;border-color:#e5484d;color:#fff}
#micx{display:none;background:transparent;color:var(--mut);border:1px solid var(--bd);padding:11px 12px}
.m a{color:var(--acc);text-decoration:underline}
#msgs{overflow-anchor:none}
#top{flex-shrink:0;text-align:center;color:var(--mut);font-size:12px;padding:4px;cursor:pointer}
#top:empty{display:none}
#bar{display:flex;gap:8px;padding:10px;background:var(--side);flex-shrink:0}
#bar input{margin:0;flex:1;min-width:0}#bar button{width:auto}
#bar{position:relative}
#emo{background:transparent;color:var(--txt);border:1px solid var(--bd);padding:11px 12px;white-space:nowrap}
#emo.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ep{display:none;position:absolute;left:10px;bottom:100%;width:min(420px,calc(100% - 20px));height:min(340px,45vh);margin-bottom:6px;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);overflow:hidden;z-index:5}
#ept{display:flex;gap:2px;padding:4px 6px;flex-shrink:0;overflow-x:auto;border-bottom:1px solid var(--bd)}
#ept button{width:auto;flex:none;background:transparent;color:var(--txt);padding:4px 8px;border-radius:8px;font-size:20px;line-height:1.3;font-family:var(--emo)}
#ept button.on{background:var(--acc)}
#epg{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));align-content:start;gap:2px}
#epg .eb{width:auto;height:40px;padding:0;background:transparent;color:var(--txt);font-size:26px;line-height:1;border-radius:8px;font-family:var(--emo)}
#epg .eb:hover{background:var(--bg)}
#epg .none{grid-column:1/-1;color:var(--mut);font-size:13px;text-align:center;padding:24px 10px}
</style>
</head>
<body>
<div id="gate"><div class="box">
<h1>🔒 Discord privé</h1>
<p>Entre le code secret pour rejoindre la communauté.</p>
<input id="code" type="password" inputmode="numeric" placeholder="Code d'accès" autocomplete="off">
<input id="pseudo" maxlength="20" placeholder="Ton pseudo" autocomplete="off">
<button id="go">Entrer</button>
<div id="err"></div>
</div></div>

<div id="app">
<div id="tabs"></div>
<div id="msgs"></div>
<div id="bar"><input id="txt" maxlength="500" placeholder="Écris un message…" autocomplete="off"><button id="micx" title="Annuler l'enregistrement">✖</button><button id="emo" type="button" title="Emojis" aria-label="Emojis">😊</button><button id="mic" title="Message vocal">🎤</button><button id="send">Envoyer</button>
<div id="ep"><div id="ept"></div><div id="epg"></div></div></div>
</div>

<div id="ov"><div class="box">
<h1>🛡️ Espace admin</h1>
<p id="ovp"></p>
<input id="acode" type="password" autocomplete="off" placeholder="Code admin">
<button id="aok">Valider</button>
<div id="aerr"></div>
<button id="acancel" class="ghost">Annuler</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var CHANNELS=[["communaute","💬 Communauté"],["avis-videos","🎬 Avis des vidéos"],["choses-aimees","❤️ Les choses que vous aimez"],["liens","🔗 Liens"]];
var db=null,cur=null,unsub=null,pseudo="";
var ipP=fetch("https://api.ipify.org?format=json").then(function(r){return r.json()}).then(function(j){return String(j.ip||"?").slice(0,45)}).catch(function(){return "?"});
var cfg=null,LOCKMS=3600000,isAdmin=false,lastList=[];
try{isAdmin=sessionStorage.getItem("dp_adm")==="1"}catch(e){}
function $(i){return document.getElementById(i)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function enter(){
  $("gate").style.display="none";$("app").style.display="flex";
  var t=$("tabs");t.textContent="";
  CHANNELS.forEach(function(c){
    var b=document.createElement("button");b.className="tab";b.textContent=c[1];b.dataset.id=c[0];
    b.onclick=function(){openChannel(c[0])};t.appendChild(b);
  });
  var a=document.createElement("button");a.id="adm";a.onclick=openOv;t.appendChild(a);
  updAdm();
  openChannel(CHANNELS[0][0]);
  refreshAllCounts();
  setInterval(function(){if(!document.hidden)refreshAllCounts()},30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshAllCounts()});
}

// ---- Compteur de messages par onglet (compte tous les messages, même non chargés, via une requête d'agrégation côté serveur)
var counts={},hidCounts={},countSeq={};
function updTab(id){
  var b=document.querySelector('.tab[data-id="'+id+'"]');if(!b)return;
  var c=null;CHANNELS.forEach(function(x){if(x[0]===id)c=x});
  // l'admin voit tout ; les autres ne comptent pas les messages effacés
  var n=counts[id]==null?null:counts[id]-(isAdmin?0:(hidCounts[id]||0));
  b.textContent=c[1]+(n==null?"":" ("+Math.max(n,0)+")");
}
function aggCount(id,hiddenOnly){
  var o=firebase.app().options;
  var url="https://firestore.googleapis.com/v1/projects/"+o.projectId+"/databases/(default)/documents/channels/"+id+":runAggregationQuery?key="+encodeURIComponent(o.apiKey);
  var q={from:[{collectionId:"messages"}]};
  if(hiddenOnly)q.where={fieldFilter:{field:{fieldPath:"hidden"},op:"EQUAL",value:{booleanValue:true}}};
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({structuredAggregationQuery:{structuredQuery:q,aggregations:[{alias:"n",count:{}}]}})})
  .then(function(r){if(!r.ok)throw new Error("count");return r.json()})
  .then(function(j){
    var f=j&&j[0]&&j[0].result&&j[0].result.aggregateFields&&j[0].result.aggregateFields.n;
    var n=f?parseInt(f.integerValue,10):NaN;
    if(isNaN(n))throw new Error("count");
    return n;
  });
}
function refreshCount(id){
  var my=(countSeq[id]=(countSeq[id]||0)+1);
  Promise.all([aggCount(id,false),aggCount(id,true)]).then(function(r){
    if(my!==countSeq[id])return; // une requête plus récente est partie entre-temps
    counts[id]=r[0];hidCounts[id]=r[1];updTab(id);
  }).catch(function(){});
}
function refreshAllCounts(){CHANNELS.forEach(function(c){refreshCount(c[0])})}

function getN(k){var v=store(k);return v?(parseInt(v,10)||0):0}
function lockLeft(){var r=getN("dp_lock")-Date.now();return r>0?r:0}
function updAdm(){document.body.classList.toggle("isadm",isAdmin);var b=$("adm");if(!b)return;b.classList.toggle("on",isAdmin);b.textContent=isAdmin?"🛡️ Admin activé (quitter)":"🛡️ Admin"}
function setAdmin(v){isAdmin=v;try{if(v)sessionStorage.setItem("dp_adm","1");else sessionStorage.removeItem("dp_adm")}catch(e){}updAdm();CHANNELS.forEach(function(c){updTab(c[0])});if(cur)render(sortedList(),true)}
function showOv(){
  var left=lockLeft();
  $("aerr").textContent="";$("acode").value="";
  if(left>0){
    var min=Math.ceil(left/60000);
    $("ovp").textContent="Trop d'essais ratés 🚫 Réessaie dans environ "+min+" minute"+(min>1?"s":"")+".";
    $("acode").style.display="none";$("aok").style.display="none";
  }else{
    $("ovp").textContent="Entre le code admin.";
    $("acode").style.display="";$("aok").style.display="";
  }
  $("ov").style.display="flex";
  if(!left)$("acode").focus();
}
function openOv(){if(isAdmin){setAdmin(false);return}showOv()}
function closeOv(){$("ov").style.display="none"}
function getCfg(){
  if(cfg)return Promise.resolve(cfg);
  return db.doc("config/access").get().then(function(d){
    if(!d.exists)throw new Error("nocfg");
    cfg=d.data();return cfg;
  });
}
function checkAdmin(){
  if(lockLeft()>0){showOv();return}
  var v=$("acode").value.trim();
  getCfg().then(function(g){
    if(v===String(g.admin)){store("dp_fail","0");closeOv();setAdmin(true);return}
    var n=getN("dp_fail")+1;
    if(n>=3){store("dp_fail","0");store("dp_lock",String(Date.now()+LOCKMS));showOv();return}
    store("dp_fail",String(n));
    $("acode").value="";
    var r=3-n;
    $("aerr").textContent="Code incorrect 🙈 Il te reste "+r+" essai"+(r>1?"s":"")+".";
  }).catch(function(){$("aerr").textContent="Impossible de vérifier le code, réessaie."});
}

var PAGE=50,all={},hasMore=false,loadingOlder=false,oldestTs=null,gotFirst=false,tok=0,stick=false;
var topEl=document.createElement("div");topEl.id="top";
topEl.onclick=function(){loadOlder()};
function sortedList(){
  return Object.keys(all).map(function(k){return all[k]}).sort(function(x,y){return (x.ts-y.ts)||(x.id<y.id?-1:1)});
}
function updTop(){
  var has=Object.keys(nodes).length>0;
  if(loadingOlder)topEl.textContent="⏳ Chargement des anciens messages…";
  else if(has&&hasMore)topEl.textContent="↑ Charger "+PAGE+" messages plus anciens";
  else if(has)topEl.textContent="— début de la conversation —";
  else topEl.textContent="";
}
function maybeAuto(){var box=$("msgs");if(box.scrollTop<150)loadOlder()}

function openChannel(id){
  cur=id;tok++;var my=tok;
  all={};hasMore=false;loadingOlder=false;oldestTs=null;gotFirst=false;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.id===id)});
  if(unsub){unsub();unsub=null}
  $("txt").placeholder=id==="liens"?"Colle un lien ici (https://…)":"Écris un message…";
  clearMsgs();
  unsub=db.collection("channels/"+id+"/messages").orderBy("ts","desc").limit(PAGE).onSnapshot(function(snap){
    if(my!==tok)return;
    var docs=snap.docs,minTs=docs.length?docs[docs.length-1].data().ts:null;
    if(!gotFirst){gotFirst=true;hasMore=docs.length>=PAGE;oldestTs=minTs}
    snap.docChanges().forEach(function(c){
      var d=c.doc,data=d.data();
      if(c.type==="removed"){
        // un message qui sort de la fenêtre des 50 derniers n'est pas supprimé : on le garde
        var slid=docs.length>=PAGE&&minTs!==null&&data.ts<minTs;
        if(!slid)delete all[d.id];
      }else all[d.id]=Object.assign({id:d.id},data);
    });
    render(sortedList());maybeAuto();
    if(snap.docChanges().length&&!snap.metadata.fromCache)refreshCount(id);
  },function(){if(my===tok)note("Impossible de lire les messages pour l'instant.")});
}

function loadOlder(){
  if(!hasMore||loadingOlder||!db||!cur||oldestTs===null)return;
  var ch=cur,my=tok;loadingOlder=true;updTop();
  db.collection("channels/"+ch+"/messages").orderBy("ts","desc").startAfter(oldestTs).limit(PAGE).get().then(function(snap){
    if(my!==tok)return;
    snap.docs.forEach(function(d){
      var data=d.data();
      if(!all[d.id])all[d.id]=Object.assign({id:d.id},data);
      if(data.ts<oldestTs)oldestTs=data.ts;
    });
    if(snap.docs.length<PAGE)hasMore=false;
    loadingOlder=false;
    var box=$("msgs"),prevH=box.scrollHeight,prevTop=box.scrollTop;
    render(sortedList(),true);
    box.scrollTop=prevTop+(box.scrollHeight-prevH);
    maybeAuto();
  }).catch(function(){
    if(my!==tok)return;
    loadingOlder=false;updTop();topEl.textContent="Impossible de charger — clique pour réessayer";
  });
}

var nodes={};
function clearMsgs(){
  Object.keys(nodes).forEach(function(id){if(nodes[id]._u)URL.revokeObjectURL(nodes[id]._u)});
  nodes={};$("msgs").textContent="";$("msgs").appendChild(topEl);
}
function note(t){clearMsgs();var n=document.createElement("div");n.id="note";n.textContent=t;$("msgs").appendChild(n)}

function fill(el,t){
  t=String(t==null?"":t);
  var re=/https?:\/\/[^\s<>"']+/gi,last=0,mt;
  while((mt=re.exec(t))){
    var raw=mt[0],trail="";
    var tm=raw.match(/[.,;:!?)\]}]+$/);
    if(tm){trail=tm[0];raw=raw.slice(0,raw.length-trail.length)}
    var href=null;
    try{var u=new URL(raw);if(u.protocol==="http:"||u.protocol==="https:")href=u.href}catch(e){}
    if(!href)continue;
    if(mt.index>last)el.appendChild(document.createTextNode(t.slice(last,mt.index)));
    var a=document.createElement("a");
    a.href=href;a.textContent=raw;a.target="_blank";a.rel="noopener noreferrer nofollow";
    el.appendChild(a);
    if(trail)el.appendChild(document.createTextNode(trail));
    last=mt.index+mt[0].length;
  }
  if(last<t.length)el.appendChild(document.createTextNode(t.slice(last)));
}

var AUDIO_OK={"audio/webm":1,"audio/ogg":1,"audio/mp4":1};
function audioEl(m,holder){
  var mime=String(m.mime||"");
  var a64=typeof m.audio==="string"?m.audio:"";
  if(!AUDIO_OK[mime]||!a64||a64.length>450000||!/^[A-Za-z0-9+\/]+={0,2}$/.test(a64))return null;
  try{
    var bin=atob(a64),arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:mime}));
    holder._u=url;
    var au=document.createElement("audio");au.controls=true;au.preload="metadata";au.src=url;
    return au;
  }catch(e){return null}
}

function buildMsg(m){
  var d=document.createElement("div");d.className="m";
  var b=document.createElement("b");b.textContent=m.name||"Anonyme";
  var s=document.createElement("small");s.textContent=new Date(m.ts).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  var h=document.createElement("div");h.className="hd";
  var l=document.createElement("span");l.appendChild(b);l.appendChild(s);
  var x=document.createElement("button");x.type="button";x.className="del";
  var hid=false;
  // état « effacé » (masqué) : fond orangé + bouton Effacer <-> Restaurer
  d._set=function(v){hid=v;d.classList.toggle("hid",v);x.classList.toggle("rst",v);x.textContent=v?"♻️ Restaurer":"🗑️ Effacer"};
  d._set(!!m.hidden);
  x.onclick=function(){
    if(!isAdmin)return;
    var ch=cur,want=!hid;
    x.disabled=true;
    db.doc("channels/"+ch+"/messages/"+m.id).update({hidden:want}).then(function(){
      refreshCount(ch);
      if(ch===cur&&all[m.id]){all[m.id].hidden=want;render(sortedList(),true)} // les anciens messages ne sont pas écoutés en direct
    }).catch(function(){alert(want?"Impossible d'effacer ce message.":"Impossible de restaurer ce message.")}).then(function(){x.disabled=false});
  };
  l.appendChild(x);
  var ipE=document.createElement("i");ipE.className="ip";ipE.textContent=String(m.ip||"").slice(0,45);
  h.appendChild(l);h.appendChild(ipE);d.appendChild(h);
  if(m.text){var p=document.createElement("div");fill(p,m.text);d.appendChild(p)}
  if(m.audio){
    var au=audioEl(m,d);
    if(au)d.appendChild(au);
    else{var bad=document.createElement("div");bad.className="bad";bad.textContent="🎤 message vocal illisible";d.appendChild(bad)}
  }
  return d;
}

function render(list,keep){
  var box=$("msgs");
  if(list&&!isAdmin)list=list.filter(function(m){return !m.hidden}); // les messages effacés ne sont visibles que de l'admin
  if(!list||!list.length){clearMsgs();note("Aucun message ici. Écris le premier ! 🎉");updTop();return}
  var nt=$("note");if(nt)nt.remove();
  var first=Object.keys(nodes).length===0;
  var near=box.scrollHeight-box.scrollTop-box.clientHeight<150;
  var ids={};list.forEach(function(m){ids[m.id]=1});
  Object.keys(nodes).forEach(function(id){
    if(!ids[id]){if(nodes[id]._u)URL.revokeObjectURL(nodes[id]._u);nodes[id].remove();delete nodes[id]}
  });
  var last=topEl,added=false;
  list.forEach(function(m){
    var n=nodes[m.id];
    if(!n){n=buildMsg(m);nodes[m.id]=n;added=true;last.after(n)}
    else n._set(!!m.hidden);
    last=n;
  });
  updTop();
  if(added&&!keep&&(first||near||stick)){box.scrollTop=box.scrollHeight;stick=false}
}

// ---- Messages vocaux
var MAXREC=30000,rec=null,recChunks=[],recTimer=null,recStart=0,recCancel=false,recStream=null,recCh=null;
function pickMime(){
  var c=["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4"];
  for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i]))return c[i]}
  return "";
}
function micUi(on){
  var b=$("mic");b.classList.toggle("rec",on);$("micx").style.display=on?"inline-block":"none";
  if(!on)b.textContent="🎤";
}
function micTick(){
  var e=Date.now()-recStart;
  var sec=Math.floor(e/1000);
  $("mic").textContent="⏹ "+Math.floor(sec/60)+":"+("0"+(sec%60)).slice(-2);
  if(e>=MAXREC&&rec&&rec.state==="recording")rec.stop();
}
function micToggle(){
  if(rec&&rec.state==="recording"){rec.stop();return}
  if(!db||!cur)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){alert("Ton navigateur ne permet pas l'enregistrement vocal.");return}
  navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}}).then(function(stream){
    recStream=stream;recCh=cur;recChunks=[];recCancel=false;
    var mt=pickMime(),o={audioBitsPerSecond:16000};if(mt)o.mimeType=mt;
    rec=new MediaRecorder(stream,o);
    rec.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data)};
    rec.onstop=micDone;
    rec.start();recStart=Date.now();micUi(true);micTick();recTimer=setInterval(micTick,250);
  }).catch(function(){alert("Micro inaccessible : autorise l'accès au micro dans ton navigateur.")});
}
function micCancel(){recCancel=true;if(rec&&rec.state==="recording")rec.stop()}
function micDone(){
  clearInterval(recTimer);micUi(false);
  if(recStream){recStream.getTracks().forEach(function(t){t.stop()});recStream=null}

// Vérifie que l'appareil sait afficher l'emoji (sinon on le masque : carré vide, lettres de drapeau, séquence éclatée…)
function emoDraw(s){
  emoCtx.clearRect(0,0,90,60);
  emoCtx.fillText(s,2,6);
  var d=emoCtx.getImageData(0,0,90,60).data,seen=false;
  for(var i=0;i<d.length;i+=4){
    if(d[i+3]>200){
      seen=true;
      if(d[i]>235&&d[i+1]<20&&d[i+2]>235)return false; // magenta pur = glyphe texte (non-emoji) donc non supporté
    }
  }
  return seen;
}
function emoSupported(s){
  if(!emoCheck)return true;
  if(!emoCtx){
    try{
      var cv=document.createElement("canvas");cv.width=90;cv.height=60;
      emoCtx=cv.getContext("2d",{willReadFrequently:true});
      emoCtx.font='32px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      emoCtx.textBaseline="top";emoCtx.fillStyle="#ff00ff";
      emoBaseW=emoCtx.measureText("😀").width;
      if(!emoBaseW||!emoDraw("😀"))throw 0; // le test ne marche pas ici : on affiche tout
    }catch(e){emoCheck=false;return true}
  }
  var r=emoOk[s];
  if(r!==undefined)return r;
  r=emoCtx.measureText(s).width<=emoBaseW*1.5&&emoDraw(s);
  emoOk[s]=r;return r;
}

function emoRecents(){
  try{var r=JSON.parse(store("dp_emo_recent")||"[]");return Array.isArray(r)?r.filter(function(x){return typeof x==="string"}).slice(0,40):[]}catch(e){return []}
}
function emoAddRecent(s){
  var r=emoRecents().filter(function(x){return x!==s});r.unshift(s);
  store("dp_emo_recent",JSON.stringify(r.slice(0,40)));
}

function emoBuild(){
  emoBuilt=true;
  var t=$("ept");
  EMO_ICONS.forEach(function(ic,i){
    var b=document.createElement("button");b.type="button";b.textContent=ic;b.title=EMO_NAMES[i];b.dataset.c=i;
    b.onclick=function(){emoCat=i;emoRender()};t.appendChild(b);
  });
  $("epg").onclick=function(e){
    var b=e.target.closest?e.target.closest(".eb"):null;
    if(b)emoInsert(b.textContent);
  };
  // garde le focus (et le clavier) dans le champ de texte quand on touche le panneau
  $("ep").addEventListener("mousedown",function(e){e.preventDefault()});
}
function emoRender(){
  document.querySelectorAll("#ept button").forEach(function(b){b.classList.toggle("on",+b.dataset.c===emoCat)});
  var g=$("epg"),frag=document.createDocumentFragment(),n=0;
  g.textContent="";g.scrollTop=0;
  var items=emoCat===0?emoRecents():EMOJI_GROUPS[emoCat-1][1].split(" ");
  items.forEach(function(s){
    if(!emoSupported(s))return;
    var b=document.createElement("button");b.type="button";b.className="eb";b.textContent=s;frag.appendChild(b);n++;
  });
  if(!n){
    var m=document.createElement("div");m.className="none";
    m.textContent=emoCat===0?"Tes emojis récents apparaîtront ici.":"Cette catégorie n'est pas prise en charge par cet appareil.";
    frag.appendChild(m);
  }
  g.appendChild(frag);
}
function emoInsert(s){
  var t=$("txt"),v=t.value,st=t.selectionStart,en=t.selectionEnd;
  if(st==null||en==null){st=en=v.length}
  var max=t.maxLength>0?t.maxLength:500;
  if(v.length-(en-st)+s.length>max)return;
  t.value=v.slice(0,st)+s+v.slice(en);
  var p=st+s.length;t.setSelectionRange(p,p);
  emoAddRecent(s);
}
function emoOpenP(on){
  if(on&&!emoBuilt)emoBuild();
  $("ep").style.display=on?"flex":"none";$("emo").classList.toggle("on",on);
  if(on){
    emoCat=emoRecents().length?0:1;emoRender();
    if(window.matchMedia&&matchMedia("(pointer:coarse)").matches)$("txt").blur(); // mobile : on masque le clavier
  }
}
function emoToggle(){emoOpenP($("ep").style.display!=="flex")}
document.addEventListener("mousedown",function(e){
  if($("ep").style.display==="flex"&&!e.target.closest("#ep")&&!e.target.closest("#emo"))emoOpenP(false);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("ep").style.display==="flex")emoOpenP(false)});


function send(){
  var v=$("txt").value.trim();
  if(!v||!db||!cur)return;
  $("txt").value="";stick=true;emoOpenP(false);
  var ch=cur;
  ipP.then(function(ip){return db.collection("channels/"+ch+"/messages").add({name:pseudo,text:v,ts:Date.now(),ip:ip})}).then(function(){refreshCount(ch)}).catch(function(e){
    $("txt").value=v;
    alert(e&&e.code==="permission-denied"?"Message refusé par la base (règles de sécurité).":"Message non envoyé, réessaie.");
  });
}

function tryGate(){
  var c=$("code").value.trim(),p=$("pseudo").value.trim();
  getCfg().then(function(g){
    if(c!==String(g.code)){$("err").textContent="Code incorrect 🙈";return}
    if(!p){$("err").textContent="Choisis un pseudo !";return}
    pseudo=p;store("dp_pseudo",p);store("dp_ok","1");enter();
  }).catch(function(){$("err").textContent="Impossible de vérifier le code, réessaie."});
}

$("aok").onclick=checkAdmin;
$("acode").onkeydown=function(e){if(e.key==="Enter")checkAdmin()};
$("acancel").onclick=closeOv;
$("go").onclick=tryGate;
$("code").onkeydown=$("pseudo").onkeydown=function(e){if(e.key==="Enter")tryGate()};
$("send").onclick=send;$("msgs").onscroll=maybeAuto;$("mic").onclick=micToggle;$("emo").onclick=emoToggle;$("micx").onclick=micCancel;
$("txt").onkeydown=function(e){if(e.key==="Enter")send()};
var sp=store("dp_pseudo");if(sp)$("pseudo").value=sp;
